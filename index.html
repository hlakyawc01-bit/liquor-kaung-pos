<section id="settings" class="page hidden">
  <div class="panel">
    <h2>Settings</h2>

    <h3>Shop Information</h3>

    <div class="productForm">
      <input id="shopName" placeholder="Shop Name">
      <input id="shopType" placeholder="Shop Type / Store Name">

      <input id="shopAddress" placeholder="Shop Address">
      <input id="posNo" placeholder="POS Number">

      <input id="cashierNo" placeholder="Cashier Number">
      <input id="cashierName" placeholder="Cashier Name">

      <select id="currency">
        <option value="SGD">SGD</option>
        <option value="USD">USD</option>
        <option value="MMK">MMK</option>
      </select>
    </div>

    <h3>Duplicate Receipt Information</h3>

    <div class="productForm">
      <input id="reprintedBy" placeholder="Reprinted By">
      <input id="passportNo" placeholder="Passport Number">

      <input id="nationality" placeholder="Nationality">
      <input id="flightCode" placeholder="Flight Code">

      <input id="flightNumber" placeholder="Flight Number">
      <input id="lotteId" placeholder="Lotte Membership ID">
    </div>

    <button onclick="saveSettings()">SAVE SETTINGS</button>

    <hr>

    <h3>Data</h3>

    <button onclick="seedProducts()">Restore Demo Products</button>
    <button onclick="exportData()">Backup Data</button>

    <label class="fileBtn">
      Restore Backup
      <input type="file" onchange="importData(event)">
    </label>
  </div>
</section><div class="bigTotal">Total: <span id="total">0</span> Ks</div><div class="bigTotal">
  Total: <span id="total">0</span>
  <span id="currencyLabel">SGD</span><div class="bigTotal">Total: SGD <span id="total">0.00</span></div>
</div>
<input id="pprice" type="number" placeholder="Price (SGD)">
